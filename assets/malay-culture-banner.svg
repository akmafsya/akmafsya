<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Asyraf Hakim — Computer System Security student</title>
  <desc id="desc">An animated Malaysian-inspired banner with songket-style geometry, a stylised wau bulan kite, and a cyber scan line.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d32"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.45" stop-color="#e9bd4f"/>
      <stop offset="1" stop-color="#9f6d16"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee7dc" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="songket" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M48 8 88 48 48 88 8 48Z" fill="none" stroke="#e9bd4f" stroke-width="1" opacity="0.24"/>
      <path d="M48 24 72 48 48 72 24 48Z" fill="none" stroke="#e9bd4f" stroke-width="1" opacity="0.18"/>
      <circle cx="48" cy="48" r="3" fill="#d83b4b" opacity="0.42"/>
      <path d="M0 48h16M80 48h16M48 0v16M48 80v16" stroke="#e9bd4f" stroke-width="1" opacity="0.16"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .pattern-scroll { animation: drift 22s linear infinite; }
    .kite { transform-box: fill-box; transform-origin: center; animation: float 5s ease-in-out infinite; }
    .kite-glow { animation: breathe 3.5s ease-in-out infinite; }
    .scan { animation: scan 5s ease-in-out infinite; }
    .spark-a { animation: twinkle 2.8s ease-in-out infinite; }
    .spark-b { animation: twinkle 2.8s 1.4s ease-in-out infinite; }
    .typed-line { opacity: 0; animation: typeLine 16s steps(34, end) infinite; }
    .typed-1 { opacity: 1; }
    .typed-2 { animation-delay: 4s; }
    .typed-3 { animation-delay: 8s; }
    .typed-4 { animation-delay: 12s; }
    .terminal-cursor { animation: blink .8s steps(1, end) infinite; }
    @keyframes drift { from { transform: translateX(-96px); } to { transform: translateX(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1.5deg); } }
    @keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: .6; } }
    @keyframes scan { 0% { transform: translateX(-520px); opacity: 0; } 18% { opacity: .7; } 82% { opacity: .7; } 100% { transform: translateX(1500px); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes typeLine {
      0%, 1% { opacity: 1; clip-path: inset(0 100% 0 0); }
      16%, 22% { opacity: 1; clip-path: inset(0 0 0 0); }
      24.5%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
    }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pattern-scroll, .kite, .kite-glow, .scan, .spark-a, .spark-b { animation: none; }
    }
  </style>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <g class="pattern-scroll">
      <rect x="-96" y="0" width="1392" height="360" fill="url(#songket)" opacity="0.7"/>
    </g>
    <path d="M0 300 C220 250 400 340 610 292 S980 242 1200 286 V360 H0Z" fill="#07111f" opacity="0.72"/>
    <path d="M0 302 C220 252 400 342 610 294 S980 244 1200 288" fill="none" stroke="#e9bd4f" stroke-width="2" opacity="0.34"/>

    <g transform="translate(76 86)">
      <rect x="0" y="0" width="48" height="4" rx="2" fill="#d83b4b"/>
      <rect x="54" y="0" width="48" height="4" rx="2" fill="#f4f4f4" opacity="0.92"/>
      <rect x="108" y="0" width="48" height="4" rx="2" fill="#2d6bb2"/>
      <rect x="162" y="0" width="48" height="4" rx="2" fill="#e9bd4f"/>
      <text x="0" y="62" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1">Muhammad Asyraf Hakim</text>
      <g fill="#b7c8db" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" letter-spacing="2">
        <text class="typed-line typed-1" x="2" y="103">COMPUTER SYSTEM SECURITY STUDENT<tspan class="terminal-cursor" fill="#7ee7dc">_</tspan></text>
        <text class="typed-line typed-2" x="2" y="103">CTF &amp; LAB LEARNER<tspan class="terminal-cursor" fill="#7ee7dc">_</tspan></text>
        <text class="typed-line typed-3" x="2" y="103">BUILDING NUSAFORGE WITH CODEX<tspan class="terminal-cursor" fill="#7ee7dc">_</tspan></text>
        <text class="typed-line typed-4" x="2" y="103">BINA · UJI · BELAJAR<tspan class="terminal-cursor" fill="#7ee7dc">_</tspan></text>
      </g>
      <text x="2" y="154" fill="#e9bd4f" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="4">BINA · UJI · BELAJAR</text>
      <text x="2" y="187" fill="#8fa7bf" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" letter-spacing="1.5">COURSEWORK  /  CTF LABS  /  AI-ASSISTED DEVELOPMENT</text>
    </g>

    <g transform="translate(991 174)">
      <ellipse class="kite-glow" cx="0" cy="0" rx="132" ry="132" fill="#e9bd4f" opacity="0.3" filter="url(#softGlow)"/>
      <g class="kite">
        <path d="M0-123C38-111 69-80 73-42c8 26 35 45 41 73-24-5-45-14-63-25-7 48-26 84-51 107C-25 90-44 54-51 6c-18 11-39 20-63 25 6-28 33-47 41-73 4-38 35-69 73-81Z" fill="url(#gold)" stroke="#fff0a6" stroke-width="2"/>
        <path d="M-57 38Q0 91 57 38Q43 91 0 116Q-43 91-57 38Z" fill="#0b1d32" stroke="#e9bd4f" stroke-width="2"/>
        <path d="M0-105V104M-55-35Q0-10 55-35M-72-8Q0 28 72-8" fill="none" stroke="#7d5411" stroke-width="2" opacity="0.82"/>
        <path d="M0-91 18-58 0-30-18-58ZM0-17 20 7 0 34-20 7Z" fill="none" stroke="#d83b4b" stroke-width="3"/>
        <circle cx="0" cy="-59" r="5" fill="#d83b4b"/>
        <path d="M0 114c10 19-12 25 0 43s-10 25 0 43" fill="none" stroke="#e9bd4f" stroke-width="2" stroke-linecap="round"/>
      </g>
      <circle class="spark-a" cx="-132" cy="-68" r="4" fill="#7ee7dc"/>
      <circle class="spark-b" cx="124" cy="74" r="3" fill="#fff0a6"/>
      <path class="spark-a" d="M-118 86h14M-111 79v14" stroke="#e9bd4f" stroke-width="2"/>
    </g>

    <g class="scan">
      <rect x="0" y="0" width="260" height="360" fill="url(#scanGradient)" opacity="0.14"/>
      <rect x="126" y="0" width="2" height="360" fill="#7ee7dc" opacity="0.5"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#e9bd4f" stroke-width="2" opacity="0.42"/>
</svg>
